name: Repository Hygiene, Physics Simulations & Portable RTL Audit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numerical dependencies
        run: python3 -m pip install -q numpy

      - name: Run deterministic repo hygiene, filename, MathJax & link audit
        run: python3 scripts/verify_repo_hygiene.py

      - name: Run unit tests (M-01 IceCat-1 Cold Spot, M-02 Analog Horizon, M-03 Impulse Audit, M-04 Sealed RTL)
        env:
          PYTHONPATH: .
        run: python3 -m unittest discover -s tests -v
